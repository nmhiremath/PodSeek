<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="100%" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818cf8"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>

    <!-- Glow Filters (SMIL compliant) -->
    <!-- Turbo: Blue Glow -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Balanced: Green Glow -->
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Rigorous: Orange Glow -->
    <filter id="glowOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Invisible Motion Guide Paths for animateMotion -->
    <!-- Turbo: Exactly follows START -> Retrieve -> (175,85) curve (602,81) -> Generate -> END -->
    <path id="pathTurbo" d="M 50 115 L 175 115 L 175 85 C 175 62, 195 48, 225 48 L 552 48 C 582 48, 602 62, 602 81 L 602 115 L 748 115" fill="none" stroke="none"/>

    <!-- Balanced (worst case, 1 rewrite): Exactly follows nodes and edges -->
    <path id="pathBalanced" d="M 50 115 L 175 115 L 340 115 L 452 115 L 452 200 L 302 200 L 240 200 C 190 200, 175 175, 175 147 L 175 115 L 340 115 L 452 115 L 452 200 L 552 200 C 582 200, 602 175, 602 147 L 602 115 L 748 115" fill="none" stroke="none"/>

    <!-- Rigorous (worst case, 2 rewrites): Loops twice through rewrite then refusal -->
    <path id="pathRigorous" d="M 50 115 L 175 115 L 340 115 L 452 115 L 452 200 L 302 200 L 240 200 C 190 200, 175 175, 175 147 L 175 115 L 340 115 L 452 115 L 452 200 L 302 200 L 240 200 C 190 200, 175 175, 175 147 L 175 115 L 340 115 L 452 115 L 452 200 L 552 200 C 582 200, 602 175, 602 147 L 602 115 L 748 115" fill="none" stroke="none"/>
  </defs>

  <!-- Title (Dedicated top line, perfectly clear of all elements) -->
  <text x="30" y="27" fill="#94a3b8" font-size="10.5" font-weight="700" letter-spacing="1">WORKFLOW · CRAG STATE MACHINE</text>

  <!-- Fast-Path Badge (Pushed up with dedicated airspace above the bypass curve) -->
  <rect x="270" y="14" width="244" height="20" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.25"/>
  <text x="392" y="27.5" fill="#38bdf8" font-size="9" font-weight="600" text-anchor="middle">Turbo · exact quote · Balanced dist &lt; 0.35</text>


  <!-- EDGES / CONNECTIONS -->
  <!-- 1. START to Retrieve -->
  <path d="M 75 115 L 115 115" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Retrieve to Grade -->
  <path d="M 235 115 L 285 115" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Single Bypass Edge: Retrieve to Generate (Curved corners matching rewrite loop) -->
  <path d="M 175 85 C 175 62, 195 48, 225 48 L 552 48 C 582 48, 602 62, 602 81" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)"/>

  <!-- 4. Grade to Decision Diamond 1 (Valid?) -->
  <path d="M 395 115 L 432 115" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Decision 1 to Generate (Success: ≥1 valid - Neutral Slate, centered) -->
  <path d="M 472 115 L 535 115" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowSlate)"/>
  <text x="503.5" y="108" fill="#94a3b8" font-size="9.5" font-weight="600" text-anchor="middle">≥1 valid</text>

  <!-- 6. Decision 1 down to Decision 2 (0 valid - Indigo) -->
  <path d="M 452 133 L 452 176" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowIndigo)"/>
  <text x="460" y="156" fill="#818cf8" font-size="9.5" font-weight="600">0 valid</text>

  <!-- 7. Decision 2 to Rewrite Query (yes: Retries < max - Indigo) -->
  <path d="M 420 200 L 365 200" fill="none" stroke="#818cf8" stroke-width="2" marker-end="url(#arrowIndigo)"/>
  <text x="392" y="192" fill="#818cf8" font-size="9.5" font-weight="600">yes</text>

  <!-- 8. Rewrite Loop back to Retrieve (Curvy loop - Indigo) -->
  <path d="M 240 200 C 190 200, 175 175, 175 147" fill="none" stroke="#818cf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowIndigo)"/>

  <!-- 9. Decision 2 to Generate (no / refusal: Retries ≥ max - Red, matching corner radius) -->
  <path d="M 484 200 L 552 200 C 582 200, 602 175, 602 147" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRose)"/>
  <text x="515" y="190" fill="#f43f5e" font-size="9.5" font-weight="600">no (refusal)</text>

  <!-- 10. Generate to END (Neutral Slate) -->
  <path d="M 670 115 L 725 115" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrowSlate)"/>

  <!-- NODES -->
  <!-- START -->
  <rect x="25" y="97" width="50" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="50" y="119" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">START</text>

  <!-- 1. Retrieve -->
  <rect x="115" y="85" width="120" height="60" rx="8" fill="url(#blueGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="175" y="108" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">🔍 Retrieve</text>
  <text x="175" y="127" fill="#93c5fd" font-size="9.5" text-anchor="middle">k=4 Chunks + Dist</text>

  <!-- 2. Grade Documents -->
  <rect x="285" y="85" width="110" height="60" rx="8" fill="url(#blueGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="340" y="108" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">⚖️ Grade</text>
  <text x="340" y="127" fill="#93c5fd" font-size="9.5" text-anchor="middle">Batch LLM Classifier</text>

  <!-- Decision Diamond 1: Valid? -->
  <polygon points="452,97 472,115 452,133 432,115" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="452" y="118" fill="#f8fafc" font-size="8.5" font-weight="700" text-anchor="middle">Valid?</text>

  <!-- Decision Diamond 2: Retries < max? (Widened to 64px for perfect label fit) -->
  <polygon points="452,176 484,200 452,224 420,200" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
  <text x="452" y="197" fill="#e2e8f0" font-size="8" font-weight="700" text-anchor="middle">Retries &lt;</text>
  <text x="452" y="208" fill="#e2e8f0" font-size="8" font-weight="700" text-anchor="middle">max?</text>

  <!-- 3. Rewrite Query (Indigo outline & dark fill) -->
  <rect x="240" y="175" width="125" height="50" rx="8" fill="url(#indigoGrad)" stroke="#818cf8" stroke-width="2"/>
  <text x="302" y="196" fill="#e0e7ff" font-size="11" font-weight="700" text-anchor="middle">✍️ Rewrite Query</text>
  <text x="302" y="212" fill="#c7d2fe" font-size="9" text-anchor="middle">Optimizer (retries &lt; max)</text>

  <!-- 4. Generate (Indigo outline & dark fill: green reserved for Balanced) -->
  <rect x="535" y="85" width="135" height="60" rx="8" fill="url(#indigoGrad)" stroke="#818cf8" stroke-width="2"/>
  <text x="602" y="108" fill="#e0e7ff" font-size="12" font-weight="700" text-anchor="middle">✨ Generate</text>
  <text x="602" y="127" fill="#c7d2fe" font-size="9.5" text-anchor="middle">Synthesis / Refusal</text>

  <!-- END (Neutral Slate) -->
  <rect x="725" y="100" width="46" height="30" rx="15" fill="#1e293b" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="748" y="119" fill="#cbd5e1" font-size="10" font-weight="700" text-anchor="middle">END</text>

  <!-- Animated Mode Lights (SMIL) with initial opacity="0" to prevent parking at (0,0) -->
  <!-- Turbo Mode Light (Blue, 4s duration, begins at 0s) -->
  <circle r="4.5" fill="#38bdf8" filter="url(#glowCyan)">
    <animateMotion dur="4s" repeatCount="indefinite" begin="0s" rotate="auto">
      <mpath href="#pathTurbo"/>
    </animateMotion>
  </circle>

  <!-- Balanced Mode Light (Green, 8s duration, begins at 1s) -->
  <circle r="4.5" fill="#10b981" filter="url(#glowGreen)" opacity="0">
    <set attributeName="opacity" to="1" begin="1s" fill="freeze"/>
    <animateMotion dur="8s" repeatCount="indefinite" begin="1s" rotate="auto">
      <mpath href="#pathBalanced"/>
    </animateMotion>
  </circle>

  <!-- Rigorous Mode Light (Orange, 12s duration, begins at 2s) -->
  <circle r="4.5" fill="#f97316" filter="url(#glowOrange)" opacity="0">
    <set attributeName="opacity" to="1" begin="2s" fill="freeze"/>
    <animateMotion dur="12s" repeatCount="indefinite" begin="2s" rotate="auto">
      <mpath href="#pathRigorous"/>
    </animateMotion>
  </circle>

  <!-- Legend & Mode Description (2 Columns: Modes on Left, Note on Right) -->
  <g transform="translate(30, 245)">
    <!-- Legend Frame -->
    <rect x="0" y="0" width="780" height="74" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>

    <!-- Column 1: Modes Stacked Vertically (Turbo, Balanced, Rigorous) -->
    <!-- Row 1: Turbo (Blue) -->
    <circle cx="20" cy="18" r="4.5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <text x="32" y="21.5" fill="#e2e8f0" font-size="10"><tspan font-weight="700" fill="#38bdf8">Turbo:</tspan> skips grading, 0 rewrites</text>

    <!-- Row 2: Balanced (Green) -->
    <circle cx="20" cy="37" r="4.5" fill="#10b981" filter="url(#glowGreen)"/>
    <text x="32" y="40.5" fill="#e2e8f0" font-size="10"><tspan font-weight="700" fill="#10b981">Balanced:</tspan> skips grading if dist &lt; 0.35, else grades, up to 1 rewrite</text>

    <!-- Row 3: Rigorous (Orange) -->
    <circle cx="20" cy="56" r="4.5" fill="#f97316" filter="url(#glowOrange)"/>
    <text x="32" y="59.5" fill="#e2e8f0" font-size="10"><tspan font-weight="700" fill="#f97316">Rigorous:</tspan> always grades, up to 2 rewrites</text>

    <!-- Column Divider -->
    <line x1="455" y1="10" x2="455" y2="64" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Column 2: Note in Grey on Right (Vertically Centered) -->
    <text x="475" y="26" fill="#94a3b8" font-size="9" font-style="italic"><tspan font-weight="700">NOTE: </tspan><tspan font-weight="700">Balanced</tspan> and <tspan font-weight="700">Rigorous</tspan> lights show the worst</text>
    <text x="475" y="40" fill="#94a3b8" font-size="9" font-style="italic">case (max rewrites). Exact quote matches skip</text>
    <text x="475" y="54" fill="#94a3b8" font-size="9" font-style="italic">grading in every mode.</text>
  </g>
</svg>
