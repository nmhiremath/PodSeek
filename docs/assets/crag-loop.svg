<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="100%" style="background-color: #0b1120; border-radius: 12px; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>

    <!-- Glow Filters (SMIL compliant) -->
    <!-- Turbo: Blue Glow -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Balanced: Green Glow -->
    <filter id="glowGreen" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Rigorous: Orange Glow -->
    <filter id="glowOrange" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Invisible Motion Guide Paths for animateMotion -->
    <!-- Turbo: Exactly follows START -> Retrieve -> (175,85) curve (602,81) -> Generate -> END -->
    <path id="pathTurbo" d="M 50 115 L 175 115 L 175 85 C 175 42, 602 42, 602 81 L 602 115 L 748 115" fill="none" stroke="none"/>

    <!-- Balanced (worst case, 1 rewrite): Exactly follows nodes and edges -->
    <path id="pathBalanced" d="M 50 115 L 175 115 L 340 115 L 452 115 L 452 200 L 302 200 L 175 200 L 175 115 L 340 115 L 452 115 L 452 200 L 472 200 C 530 200, 570 170, 580 147 L 602 115 L 748 115" fill="none" stroke="none"/>

    <!-- Rigorous (worst case, 2 rewrites): Loops twice through rewrite then refusal -->
    <path id="pathRigorous" d="M 50 115 L 175 115 L 340 115 L 452 115 L 452 200 L 302 200 L 175 200 L 175 115 L 340 115 L 452 115 L 452 200 L 302 200 L 175 200 L 175 115 L 340 115 L 452 115 L 452 200 L 472 200 C 530 200, 570 170, 580 147 L 602 115 L 748 115" fill="none" stroke="none"/>
  </defs>

  <!-- Title (Dedicated top line, perfectly clear of all elements) -->
  <text x="30" y="24" fill="#94a3b8" font-size="11" font-weight="700" letter-spacing="1">WORKFLOW · CRAG STATE MACHINE</text>

  <!-- Fast-Path Badge (Positioned below title, centered on bypass arc) -->
  <rect x="275" y="32" width="250" height="20" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="400" y="45.5" fill="#38bdf8" font-size="9" font-weight="600" text-anchor="middle">Turbo · exact quote · Balanced dist &lt; 0.35</text>

  <!-- EDGES / CONNECTIONS -->
  <!-- 1. START to Retrieve -->
  <path d="M 75 115 L 115 115" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 2. Retrieve to Grade -->
  <path d="M 235 115 L 285 115" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 3. Single Bypass Edge: Retrieve to Generate (over top) -->
  <path d="M 175 85 C 175 42, 602 42, 602 81" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)"/>

  <!-- 4. Grade to Decision Diamond 1 (Valid?) -->
  <path d="M 395 115 L 432 115" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- 5. Decision 1 to Generate (Success: ≥1 valid) -->
  <path d="M 472 115 L 535 115" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="495" y="108" fill="#10b981" font-size="9.5" font-weight="600">≥1 valid</text>

  <!-- 6. Decision 1 down to Decision 2 (0 valid) -->
  <path d="M 452 133 L 452 182" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="458" y="160" fill="#f59e0b" font-size="9.5" font-weight="600">0 valid</text>

  <!-- 7. Decision 2 to Rewrite Query (yes: Retries < max) -->
  <path d="M 432 200 L 365 200" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="398" y="193" fill="#f59e0b" font-size="9.5" font-weight="600">yes</text>

  <!-- 8. Rewrite Loop back to Retrieve -->
  <path d="M 240 200 L 175 200 L 175 147" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowAmber)"/>

  <!-- 9. Decision 2 to Generate (no / refusal: Retries ≥ max) -->
  <path d="M 472 200 C 530 200, 570 170, 580 147" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRose)"/>
  <text x="492" y="193" fill="#f43f5e" font-size="9.5" font-weight="600">no (refusal)</text>

  <!-- 10. Generate to END -->
  <path d="M 670 115 L 725 115" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- NODES -->
  <!-- START -->
  <rect x="25" y="97" width="50" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="50" y="119" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">START</text>

  <!-- 1. Retrieve -->
  <rect x="115" y="85" width="120" height="60" rx="8" fill="url(#blueGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="175" y="108" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">🔍 Retrieve</text>
  <text x="175" y="127" fill="#93c5fd" font-size="9.5" text-anchor="middle">k=4 Chunks + Dist</text>

  <!-- 2. Grade Documents -->
  <rect x="285" y="85" width="110" height="60" rx="8" fill="url(#blueGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="340" y="108" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">⚖️ Grade</text>
  <text x="340" y="127" fill="#93c5fd" font-size="9.5" text-anchor="middle">Batch LLM Classifier</text>

  <!-- Decision Diamond 1: Valid? -->
  <polygon points="452,97 472,115 452,133 432,115" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="452" y="118" fill="#f8fafc" font-size="8.5" font-weight="700" text-anchor="middle">Valid?</text>

  <!-- Decision Diamond 2: Retries < max? -->
  <polygon points="452,182 472,200 452,218 432,200" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="452" y="197" fill="#fef3c7" font-size="7.5" font-weight="700" text-anchor="middle">Retries &lt;</text>
  <text x="452" y="207" fill="#fef3c7" font-size="7.5" font-weight="700" text-anchor="middle">max?</text>

  <!-- 3. Rewrite Query -->
  <rect x="240" y="175" width="125" height="50" rx="8" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="2"/>
  <text x="302" y="196" fill="#fef3c7" font-size="11" font-weight="700" text-anchor="middle">✍️ Rewrite Query</text>
  <text x="302" y="212" fill="#fcd34d" font-size="9" text-anchor="middle">Optimizer (retries &lt; max)</text>

  <!-- 4. Generate (Unified node: synthesis or refusal) -->
  <rect x="535" y="85" width="135" height="60" rx="8" fill="url(#greenGrad)" stroke="#10b981" stroke-width="2"/>
  <text x="602" y="108" fill="#ecfdf5" font-size="12" font-weight="700" text-anchor="middle">✨ Generate</text>
  <text x="602" y="127" fill="#a7f3d0" font-size="9.5" text-anchor="middle">Synthesis / Refusal</text>

  <!-- END -->
  <rect x="725" y="100" width="46" height="30" rx="15" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="748" y="119" fill="#ecfdf5" font-size="10" font-weight="700" text-anchor="middle">END</text>

  <!-- Animated Mode Lights (SMIL) -->
  <!-- Turbo Mode Light (Blue, 4s duration, begins at 0s) -->
  <circle r="4.5" fill="#38bdf8" filter="url(#glowCyan)">
    <animateMotion dur="4s" repeatCount="indefinite" begin="0s" rotate="auto">
      <mpath href="#pathTurbo"/>
    </animateMotion>
  </circle>

  <!-- Balanced Mode Light (Green, 8s duration, begins at 1s) -->
  <circle r="4.5" fill="#10b981" filter="url(#glowGreen)">
    <animateMotion dur="8s" repeatCount="indefinite" begin="1s" rotate="auto">
      <mpath href="#pathBalanced"/>
    </animateMotion>
  </circle>

  <!-- Rigorous Mode Light (Orange, 12s duration, begins at 2s) -->
  <circle r="4.5" fill="#f97316" filter="url(#glowOrange)">
    <animateMotion dur="12s" repeatCount="indefinite" begin="2s" rotate="auto">
      <mpath href="#pathRigorous"/>
    </animateMotion>
  </circle>

  <!-- Legend & Mode Description (2 Columns: Modes on Left, Note on Right) -->
  <g transform="translate(30, 245)">
    <!-- Legend Frame -->
    <rect x="0" y="0" width="780" height="74" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>

    <!-- Column 1: Modes Stacked Vertically (Turbo, Balanced, Rigorous) -->
    <!-- Row 1: Turbo (Blue) -->
    <circle cx="20" cy="18" r="4.5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <text x="32" y="21.5" fill="#e2e8f0" font-size="10"><tspan font-weight="700" fill="#38bdf8">Turbo:</tspan> skips grading, 0 rewrites</text>

    <!-- Row 2: Balanced (Green) -->
    <circle cx="20" cy="37" r="4.5" fill="#10b981" filter="url(#glowGreen)"/>
    <text x="32" y="40.5" fill="#e2e8f0" font-size="10"><tspan font-weight="700" fill="#10b981">Balanced:</tspan> skips grading if dist &lt; 0.35, else grades, up to 1 rewrite</text>

    <!-- Row 3: Rigorous (Orange) -->
    <circle cx="20" cy="56" r="4.5" fill="#f97316" filter="url(#glowOrange)"/>
    <text x="32" y="59.5" fill="#e2e8f0" font-size="10"><tspan font-weight="700" fill="#f97316">Rigorous:</tspan> always grades, up to 2 rewrites</text>

    <!-- Column Divider -->
    <line x1="455" y1="10" x2="455" y2="64" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Column 2: Note in Grey on Right -->
    <text x="475" y="21" fill="#64748b" font-size="9" font-weight="700" letter-spacing="1">NOTE</text>
    <text x="475" y="37" fill="#94a3b8" font-size="9" font-style="italic">Balanced and Rigorous lights show the worst</text>
    <text x="475" y="50" fill="#94a3b8" font-size="9" font-style="italic">case (max rewrites). Exact quote matches skip</text>
    <text x="475" y="63" fill="#94a3b8" font-size="9" font-style="italic">grading in every mode.</text>
  </g>
</svg>
