<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="100%" height="100%" style="background-color: #0b1120; border-radius: 12px; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>

    <!-- Glow Filters (SMIL compliant) -->
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowAmber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowViolet" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Motion Paths for Modes -->
    <!-- Turbo: START -> Retrieve -> Bypass -> Generate -> END -->
    <path id="pathTurbo" d="M 50 105 L 175 105 C 175 32, 600 32, 600 75 L 602 105 L 748 105" fill="none"/>

    <!-- Balanced (worst case, 1 rewrite): START -> Retrieve -> Grade -> Valid? -> Retries<max? -> Rewrite -> Retrieve -> Grade -> Valid? -> Retries<max? -> Generate -> END -->
    <path id="pathBalanced" d="M 50 105 L 175 105 L 340 105 L 452 105 L 452 190 L 302 190 L 175 190 L 175 105 L 340 105 L 452 105 L 452 190 C 530 190, 570 160, 580 135 L 602 105 L 748 105" fill="none"/>

    <!-- Rigorous (worst case, 2 rewrites): Loop twice then Generate -> END -->
    <path id="pathRigorous" d="M 50 105 L 175 105 L 340 105 L 452 105 L 452 190 L 302 190 L 175 190 L 175 105 L 340 105 L 452 105 L 452 190 L 302 190 L 175 190 L 175 105 L 340 105 L 452 105 L 452 190 C 530 190, 570 160, 580 135 L 602 105 L 748 105" fill="none"/>
  </defs>

  <!-- Title / Badge -->
  <text x="30" y="30" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1">WORKFLOW · CORRECTIVE RAG (SELF-RAG) STATE MACHINE</text>

  <!-- Static Paths (Connections) -->
  <!-- START to Retrieve -->
  <path d="M 75 105 L 115 105" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Retrieve to Grade -->
  <path d="M 235 105 L 285 105" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Bypass Edge: Retrieve to Generate (over top) -->
  <path d="M 175 75 C 175 32, 600 32, 600 70" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)"/>
  <rect x="250" y="20" width="295" height="18" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="397" y="32" fill="#38bdf8" font-size="9" font-weight="600" text-anchor="middle">Turbo · exact quote · Balanced dist &lt; 0.35</text>

  <!-- Grade to Decision Diamond 1 (Valid?) -->
  <path d="M 395 105 L 432 105" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 1 to Generate (Success: ≥1 valid) -->
  <path d="M 472 105 L 535 105" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="495" y="98" fill="#10b981" font-size="9.5" font-weight="600">≥1 valid</text>

  <!-- Decision 1 down to Decision 2 (0 valid) -->
  <path d="M 452 123 L 452 172" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="458" y="150" fill="#f59e0b" font-size="9.5" font-weight="600">0 valid</text>

  <!-- Decision 2 to Rewrite Query (yes: Retries < max) -->
  <path d="M 432 190 L 365 190" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="398" y="183" fill="#f59e0b" font-size="9.5" font-weight="600">yes</text>

  <!-- Rewrite Loop back to Retrieve -->
  <path d="M 240 190 L 175 190 L 175 143" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowAmber)"/>

  <!-- Decision 2 to Generate (no / refusal: Retries ≥ max) -->
  <path d="M 472 190 C 530 190, 570 160, 580 143" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowRose)"/>
  <text x="492" y="183" fill="#f43f5e" font-size="9.5" font-weight="600">no (refusal)</text>

  <!-- Generate to END -->
  <path d="M 670 105 L 720 105" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- NODES -->
  <!-- START -->
  <rect x="25" y="87" width="50" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <text x="50" y="109" fill="#cbd5e1" font-size="11" font-weight="700" text-anchor="middle">START</text>

  <!-- 1. Retrieve -->
  <rect x="115" y="75" width="120" height="60" rx="8" fill="url(#blueGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="175" y="98" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">🔍 Retrieve</text>
  <text x="175" y="117" fill="#93c5fd" font-size="9.5" text-anchor="middle">k=4 Chunks + Dist</text>

  <!-- 2. Grade Documents -->
  <rect x="285" y="75" width="110" height="60" rx="8" fill="url(#blueGrad)" stroke="#3b82f6" stroke-width="2"/>
  <text x="340" y="98" fill="#f8fafc" font-size="12" font-weight="700" text-anchor="middle">⚖️ Grade</text>
  <text x="340" y="117" fill="#93c5fd" font-size="9.5" text-anchor="middle">Batch LLM Classifier</text>

  <!-- Decision Diamond 1: Valid? -->
  <polygon points="452,87 472,105 452,123 432,105" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="452" y="108" fill="#f8fafc" font-size="8.5" font-weight="700" text-anchor="middle">Valid?</text>

  <!-- Decision Diamond 2: Retries < max? -->
  <polygon points="452,172 472,190 452,208 432,190" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="452" y="187" fill="#fef3c7" font-size="7.5" font-weight="700" text-anchor="middle">Retries &lt;</text>
  <text x="452" y="197" fill="#fef3c7" font-size="7.5" font-weight="700" text-anchor="middle">max?</text>

  <!-- 3. Rewrite Query -->
  <rect x="240" y="165" width="125" height="50" rx="8" fill="url(#amberGrad)" stroke="#f59e0b" stroke-width="2"/>
  <text x="302" y="186" fill="#fef3c7" font-size="11" font-weight="700" text-anchor="middle">✍️ Rewrite Query</text>
  <text x="302" y="202" fill="#fcd34d" font-size="9" text-anchor="middle">Optimizer (retries &lt; max)</text>

  <!-- 4. Generate (Unified node: synthesis or refusal) -->
  <rect x="535" y="75" width="135" height="60" rx="8" fill="url(#greenGrad)" stroke="#10b981" stroke-width="2"/>
  <text x="602" y="98" fill="#ecfdf5" font-size="12" font-weight="700" text-anchor="middle">✨ Generate</text>
  <text x="602" y="117" fill="#a7f3d0" font-size="9.5" text-anchor="middle">Synthesis / Refusal</text>

  <!-- END -->
  <rect x="725" y="90" width="46" height="30" rx="15" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="748" y="109" fill="#ecfdf5" font-size="10" font-weight="700" text-anchor="middle">END</text>

  <!-- Static Faint Paths for Reduced Motion / Non-Animated Fallback -->
  <path d="M 50 105 L 175 105 C 175 32, 600 32, 600 75 L 602 105 L 748 105" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.3"/>
  <path d="M 50 105 L 175 105 L 340 105 L 452 105 L 452 190 L 302 190 L 175 190 L 175 105 L 340 105 L 452 105 L 452 190 C 530 190, 570 160, 580 135 L 602 105 L 748 105" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.3"/>
  <path d="M 50 105 L 175 105 L 340 105 L 452 105 L 452 190 C 530 190, 570 160, 580 135 L 602 105 L 748 105" fill="none" stroke="#a78bfa" stroke-width="1.5" stroke-dasharray="2,4" opacity="0.3"/>

  <!-- Animated Mode Lights (SMIL) -->
  <!-- Turbo Mode Light (Cyan, 4s duration, begins at 0s) -->
  <circle r="4.5" fill="#38bdf8" filter="url(#glowCyan)">
    <animateMotion dur="4s" repeatCount="indefinite" begin="0s" rotate="auto">
      <mpath href="#pathTurbo"/>
    </animateMotion>
  </circle>

  <!-- Balanced Mode Light (Amber, 8s duration, begins at 1s) -->
  <circle r="4.5" fill="#f59e0b" filter="url(#glowAmber)">
    <animateMotion dur="8s" repeatCount="indefinite" begin="1s" rotate="auto">
      <mpath href="#pathBalanced"/>
    </animateMotion>
  </circle>

  <!-- Rigorous Mode Light (Violet, 12s duration, begins at 2s) -->
  <circle r="4.5" fill="#a78bfa" filter="url(#glowViolet)">
    <animateMotion dur="12s" repeatCount="indefinite" begin="2s" rotate="auto">
      <mpath href="#pathRigorous"/>
    </animateMotion>
  </circle>

  <!-- Legend & Mode Description (Bottom Right) -->
  <g transform="translate(30, 235)">
    <!-- Legend Frame -->
    <rect x="0" y="0" width="780" height="72" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>

    <!-- Row 1: Turbo -->
    <circle cx="20" cy="18" r="4.5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <text x="32" y="21" fill="#e2e8f0" font-size="10"><tspan font-weight="700" fill="#38bdf8">Turbo:</tspan> skips grading, 0 rewrites</text>

    <!-- Row 2: Balanced -->
    <circle cx="270" cy="18" r="4.5" fill="#f59e0b" filter="url(#glowAmber)"/>
    <text x="282" y="21" fill="#e2e8f0" font-size="10"><tspan font-weight="700" fill="#f59e0b">Balanced:</tspan> skips grading if dist &lt; 0.35, else grades, up to 1 rewrite</text>

    <!-- Row 3: Rigorous -->
    <circle cx="20" cy="40" r="4.5" fill="#a78bfa" filter="url(#glowViolet)"/>
    <text x="32" y="43" fill="#e2e8f0" font-size="10"><tspan font-weight="700" fill="#a78bfa">Rigorous:</tspan> always grades, up to 2 rewrites</text>

    <!-- Footnote -->
    <text x="20" y="60" fill="#94a3b8" font-size="9" font-style="italic">Balanced and Rigorous lights show the worst case (max rewrites). Exact quote matches skip grading in every mode.</text>
  </g>
</svg>
